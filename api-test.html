<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MigrantCare 云函数测试页面</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        .status {
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            font-weight: bold;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .endpoint {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }
        .endpoint h3 {
            color: #495057;
            margin-top: 0;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
        }
        button:hover {
            background: #0056b3;
        }
        button:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }
        .response {
            background: #f1f3f4;
            border: 1px solid #dadce0;
            border-radius: 5px;
            padding: 15px;
            margin-top: 10px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
        .input-group {
            margin: 10px 0;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .input-group input, .input-group textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 14px;
        }
        .input-group textarea {
            height: 80px;
            resize: vertical;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 MigrantCare 云函数测试页面</h1>
        
        <div id="serverStatus" class="status">检查服务器状态中...</div>
        
        <!-- 健康检查 -->
        <div class="endpoint">
            <h3>🏥 健康检查</h3>
            <p>检查服务器是否正常运行</p>
            <button onclick="checkHealth()">检查健康状态</button>
            <div id="healthResponse" class="response" style="display:none;"></div>
        </div>
        
        <!-- 发送邮件 -->
        <div class="endpoint">
            <h3>📧 发送邮件</h3>
            <div class="input-group">
                <label>收件人邮箱:</label>
                <input type="email" id="recipient" value="test@example.com">
            </div>
            <div class="input-group">
                <label>邮件主题:</label>
                <input type="text" id="subject" value="测试邮件">
            </div>
            <div class="input-group">
                <label>邮件内容:</label>
                <textarea id="body">这是一封测试邮件，用于验证 MigrantCare 云函数的邮件发送功能。</textarea>
            </div>
            <button onclick="sendEmail()">发送邮件</button>
            <div id="emailResponse" class="response" style="display:none;"></div>
        </div>
        
        <!-- 获取预约报告 -->
        <div class="endpoint">
            <h3>📊 获取预约报告</h3>
            <div class="input-group">
                <label>开始日期:</label>
                <input type="date" id="startDate" value="2023-12-01">
            </div>
            <div class="input-group">
                <label>结束日期:</label>
                <input type="date" id="endDate" value="2023-12-31">
            </div>
            <button onclick="getReports()">获取报告</button>
            <div id="reportsResponse" class="response" style="display:none;"></div>
        </div>
        
        <!-- 审计日志 -->
        <div class="endpoint">
            <h3>📋 审计日志</h3>
            <button onclick="getAuditLog()">获取审计日志</button>
            <div id="auditResponse" class="response" style="display:none;"></div>
        </div>
    </div>
    
    <script>
        const API_BASE = 'http://localhost:5001';
        const AUTH_TOKEN = 'valid-token';
        
        // 检查服务器状态
        async function checkServerStatus() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                document.getElementById('serverStatus').className = 'status success';
                document.getElementById('serverStatus').textContent = `✅ 服务器运行正常 - ${data.status} (${new Date(data.timestamp).toLocaleString()})`;
            } catch (error) {
                document.getElementById('serverStatus').className = 'status error';
                document.getElementById('serverStatus').textContent = `❌ 服务器连接失败: ${error.message}`;
            }
        }
        
        // 健康检查
        async function checkHealth() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                showResponse('healthResponse', data, response.status);
            } catch (error) {
                showResponse('healthResponse', { error: error.message }, 0);
            }
        }
        
        // 发送邮件
        async function sendEmail() {
            const recipient = document.getElementById('recipient').value;
            const subject = document.getElementById('subject').value;
            const body = document.getElementById('body').value;
            
            if (!recipient || !subject || !body) {
                alert('请填写所有必填字段');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/sendEmail`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${AUTH_TOKEN}`
                    },
                    body: JSON.stringify({
                        recipient,
                        subject,
                        body,
                        requestId: generateUUID()
                    })
                });
                const data = await response.json();
                showResponse('emailResponse', data, response.status);
            } catch (error) {
                showResponse('emailResponse', { error: error.message }, 0);
            }
        }
        
        // 获取预约报告
        async function getReports() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            
            if (!startDate || !endDate) {
                alert('请选择开始和结束日期');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/getAppointmentReports?startDate=${startDate}&endDate=${endDate}`, {
                    headers: {
                        'Authorization': `Bearer ${AUTH_TOKEN}`
                    }
                });
                const data = await response.json();
                showResponse('reportsResponse', data, response.status);
            } catch (error) {
                showResponse('reportsResponse', { error: error.message }, 0);
            }
        }
        
        // 获取审计日志
        async function getAuditLog() {
            try {
                const response = await fetch(`${API_BASE}/auditLog`, {
                    headers: {
                        'Authorization': `Bearer ${AUTH_TOKEN}`
                    }
                });
                const data = await response.json();
                showResponse('auditResponse', data, response.status);
            } catch (error) {
                showResponse('auditResponse', { error: error.message }, 0);
            }
        }
        
        // 显示响应
        function showResponse(elementId, data, status) {
            const element = document.getElementById(elementId);
            element.style.display = 'block';
            element.textContent = `状态码: ${status}\n\n${JSON.stringify(data, null, 2)}`;
        }
        
        // 生成UUID
        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0;
                const v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }
        
        // 页面加载时检查服务器状态
        window.onload = function() {
            checkServerStatus();
            // 每30秒检查一次服务器状态
            setInterval(checkServerStatus, 30000);
        };
    </script>
</body>
</html>

        {

        {

          experience: 8,
          bio: "Dr. Patel specializes in pediatric care and women's health, with a focus on culturally sensitive healthcare.",
          isActive: true,
        },
      ]

      async function initializeDoctors() {
        const statusDiv = document.getElementById('status')
        statusDiv.innerHTML = 'Initializing doctors...'

        try {
          console.log('开始初始化医生数据...')

          for (const doctorData of initialDoctors) {
            try {
              // 检查医生是否已存在
              const existingResult = await ClinicianAPI.getAllClinicians()
              const exists =
                existingResult.success &&
                existingResult.data.some((doc) => doc.email === doctorData.email)

              if (!exists) {
                // 创建新医生
                const result = await ClinicianAPI.createClinician(doctorData, 'admin-token')
                if (result.success) {
                  console.log(`已创建医生: ${doctorData.name}`)
                  statusDiv.innerHTML += `<br>已创建医生: ${doctorData.name}`
                } else {
                  console.error(`创建医生失败: ${doctorData.name}`, result.error)
                  statusDiv.innerHTML += `<br>创建医生失败: ${doctorData.name} - ${result.error}`
                }
              } else {
                console.log(`医生已存在: ${doctorData.name}`)
                statusDiv.innerHTML += `<br>医生已存在: ${doctorData.name}`
              }
            } catch (error) {
              console.error(`创建医生 ${doctorData.name} 时出错:`, error)
              statusDiv.innerHTML += `<br>创建医生 ${doctorData.name} 时出错: ${error.message}`
            }
          }

          statusDiv.innerHTML += '<br><strong>医生数据初始化完成</strong>'
          console.log('医生数据初始化完成')
        } catch (error) {
          console.error('初始化医生数据时出错:', error)
          statusDiv.innerHTML += `<br><strong>初始化失败: ${error.message}</strong>`
        }
      }

      document.getElementById('initBtn').addEventListener('click', initializeDoctors)
      // 页面加载后自动执行初始化，避免手动点击
      window.addEventListener('load', () => {
        try { initializeDoctors() } catch (e) { console.error('自动初始化失败:', e) }
      })
    </script>
  </body>
</html>
